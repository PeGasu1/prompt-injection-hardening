[project]
name = "pi-hardening"
version = "0.1.0"
description = "Hardening lightweight prompt-injection detectors against character-level obfuscation"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
